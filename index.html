<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gravitational N-Body &amp; Orbital Mechanics Laboratory</title>
<style>
:root{
  --bg-0:#05070d; --bg-1:#0c1220;
  --glass:rgba(14,20,32,.58);
  --stroke:rgba(148,163,184,.20);
  --stroke-2:rgba(148,163,184,.38);
  --text:#e8eefb; --muted:#93a2ba; --dim:#5f7089;
  --teal:#5eead4; --blue:#7cc0ff; --violet:#a99bff;
  --good:#3ddc97; --warn:#ffc861; --bad:#ff7a8a;
  --shadow:0 22px 60px rgba(0,0,0,.55);
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1200px 800px at 20% 10%,#101a2c 0%,var(--bg-1) 45%,var(--bg-0) 100%);
  color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.45;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
}
canvas#sky{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
canvas#sky.grabbing{cursor:grabbing}
.ui{position:fixed;z-index:10;max-width:calc(100vw - 24px)}
.glass{
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border:1px solid var(--stroke);border-radius:16px;
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07);
}
#hud{top:14px;left:14px;width:254px}
#dock{left:14px;bottom:14px;width:324px}
#keys{right:14px;bottom:14px;padding:9px 12px;color:var(--dim);font-size:11px;
  display:flex;gap:11px;flex-wrap:wrap;align-items:center;max-width:min(600px,calc(100vw - 28px))}
#keys span{white-space:nowrap}
.phead{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;border:0;
  width:100%;background:transparent;color:inherit;text-align:left;font:inherit;border-radius:16px}
.phead h1{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  font-weight:650;flex:1;transition:color .2s ease}
.phead:hover h1{color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);flex:none}
.dot.alt{background:var(--violet);box-shadow:0 0 12px var(--violet)}
.chev{flex:none;font-size:11px;color:var(--muted);line-height:1;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.collapsed .chev{transform:rotate(-90deg)}
.pbody{padding:2px 13px 14px;display:grid;gap:11px}
.collapsed>.pbody{display:none}
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--stroke-2),transparent);margin:1px -2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11.5px;
  color:var(--muted);padding:1px 0}
.stat b{font-family:var(--mono);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--text);letter-spacing:-.01em}
.stat b.good{color:var(--good)} .stat b.warn{color:var(--warn)} .stat b.bad{color:var(--bad)}
.mini{font-size:10.5px;color:var(--dim)}
</style>

<style>
label.ctl{display:grid;gap:5px}
.ctl .cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.ctl .cap output{font-family:var(--mono);font-size:11.5px;letter-spacing:0;text-transform:none;
  color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;
  background:transparent;cursor:pointer}
input[type=range]:focus{outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;
  background:linear-gradient(90deg,var(--teal) 0 var(--fill,50%),rgba(255,255,255,.13) var(--fill,50%) 100%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;
  margin-top:-4.5px;border-radius:50%;background:#0b111c;border:2px solid var(--teal);
  box-shadow:0 0 0 0 rgba(94,234,212,.28),0 2px 7px rgba(0,0,0,.6);
  transition:transform .14s ease,box-shadow .2s ease}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.16);box-shadow:0 0 0 5px rgba(94,234,212,.17),0 2px 7px rgba(0,0,0,.6)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.04);box-shadow:0 0 0 8px rgba(94,234,212,.24)}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(124,192,255,.35)}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:rgba(255,255,255,.13)}
input[type=range]::-moz-range-progress{height:4px;border-radius:999px;background:var(--teal)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:2px solid var(--teal);border-radius:50%;background:#0b111c}
input.violet::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--violet) 0 var(--fill,50%),rgba(255,255,255,.13) var(--fill,50%) 100%)}
input.violet::-webkit-slider-thumb{border-color:var(--violet)}
input.violet:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(169,155,255,.18)}
input.violet::-moz-range-progress{background:var(--violet)}
input.blue::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--blue) 0 var(--fill,50%),rgba(255,255,255,.13) var(--fill,50%) 100%)}
input.blue::-webkit-slider-thumb{border-color:var(--blue)}
input.blue:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(124,192,255,.18)}
input.blue::-moz-range-progress{background:var(--blue)}
.btn{font:inherit;font-size:12px;color:var(--text);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 11px;border-radius:10px;border:1px solid var(--stroke);
  background:linear-gradient(180deg,rgba(148,163,184,.15),rgba(148,163,184,.05));
  transition:transform .13s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease}
.btn:hover{background:linear-gradient(180deg,rgba(148,163,184,.26),rgba(148,163,184,.09));
  border-color:var(--stroke-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.975)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{border-color:rgba(94,234,212,.45);color:#e7fffb;
  background:linear-gradient(180deg,rgba(94,234,212,.26),rgba(94,234,212,.07));
  box-shadow:0 0 22px rgba(94,234,212,.13)}
.btn.primary:hover{background:linear-gradient(180deg,rgba(94,234,212,.36),rgba(94,234,212,.11))}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
select{font:inherit;font-size:12.5px;color:var(--text);width:100%;padding:9px 30px 9px 11px;
  border-radius:10px;border:1px solid var(--stroke);background:rgba(9,14,23,.72);cursor:pointer;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2393a2ba' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;
  transition:border-color .2s ease}
select:hover{border-color:var(--stroke-2)}
select:focus{outline:none;border-color:rgba(124,192,255,.6)}
option{background:#0b111c;color:var(--text)}
.toggles{display:flex;flex-wrap:wrap;gap:7px}
.switch{position:relative;display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 7px;
  border-radius:999px;border:1px solid var(--stroke);background:rgba(148,163,184,.07);cursor:pointer;
  font-size:11.5px;color:var(--muted);transition:color .2s ease,border-color .2s ease,background .2s ease}
.switch:hover{border-color:var(--stroke-2);color:var(--text)}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .knob{width:26px;height:15px;border-radius:999px;background:rgba(255,255,255,.14);
  position:relative;transition:background .22s ease;flex:none}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;
  background:#9fb0c9;transition:transform .24s cubic-bezier(.4,0,.2,1),background .22s ease}
.switch input:checked+.knob{background:rgba(94,234,212,.34)}
.switch input:checked+.knob::after{transform:translateX(11px);background:var(--teal)}
.switch input:focus-visible+.knob{box-shadow:0 0 0 3px rgba(124,192,255,.4)}
.switch.on{color:#e7fffb;border-color:rgba(94,234,212,.42);background:rgba(94,234,212,.12)}
kbd{font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:5px;
  border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--muted)}
#blurb{font-size:11.5px;color:var(--muted);line-height:1.5}
#blurb strong{color:var(--text);font-weight:600}
@media (max-width:780px){
  #dock{width:calc(100vw - 20px);left:10px;bottom:10px}
  #hud{width:calc(100vw - 20px);left:10px;top:10px}
  #keys{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="sky" aria-label="N-body gravitational simulation canvas"></canvas>

<section id="hud" class="ui glass" aria-live="off">
  <button class="phead" id="hudHead" title="Collapse / expand telemetry (H)">
    <span class="dot"></span><h1>Telemetry</h1><span class="chev">&#9662;</span>
  </button>
  <div class="pbody">
    <div class="stat"><span>FPS</span><b id="sFps">0</b></div>
    <div class="stat"><span>Bodies</span><b id="sBodies">0</b></div>
    <div class="stat"><span>Sim time</span><b id="sTime">0</b></div>
    <div class="stat"><span>Steps / s</span><b id="sSteps">0</b></div>
    <div class="divider"></div>
    <div class="stat"><span>Kinetic T</span><b id="sT">0</b></div>
    <div class="stat"><span>Potential U</span><b id="sU">0</b></div>
    <div class="stat"><span>Total E</span><b id="sE">0</b></div>
    <div class="stat"><span>Drift &Delta;E/E&#8320;</span><b id="sDrift">0%</b></div>
    <div class="divider"></div>
    <div class="stat"><span>Momentum |p|</span><b id="sP">0</b></div>
    <div class="stat"><span>p&#8339; , p&#8339;</span><b id="sPxy">0, 0</b></div>
    <div class="stat"><span>Center of mass</span><b id="sCom">0, 0</b></div>
    <div class="divider"></div>
    <div class="stat"><span>View scale</span><b id="sZoom">0</b></div>
    <div class="mini" id="sSoft">softening &epsilon; = 0</div>
  </div>
</section>

<section id="dock" class="ui glass">
  <button class="phead" id="dockHead" title="Collapse / expand controls (C)">
    <span class="dot alt"></span><h1>Mission Control</h1><span class="chev">&#9662;</span>
  </button>
  <div class="pbody">
    <label class="ctl">
      <span class="cap">Preset scenario <output id="presetCount"></output></span>
      <select id="preset" aria-label="Preset scenario"></select>
    </label>
    <p id="blurb"></p>
    <div class="divider"></div>
    <div class="grid2">
      <button class="btn primary" id="btnPlay" aria-pressed="true">Pause</button>
      <button class="btn" id="btnStep" title="Advance one time step (S)">Step &#10230;</button>
      <button class="btn" id="btnReset" title="Re-initialise the current preset (R)">Reset preset</button>
      <button class="btn ghost" id="btnClear" title="Remove every body (X)">Clear</button>
    </div>
    <label class="ctl">
      <span class="cap">Time step dt <output id="oDt"></output></span>
      <input type="range" id="rDt" min="0" max="1000" value="500">
    </label>
    <label class="ctl">
      <span class="cap">Gravity G <output id="oG"></output></span>
      <input type="range" id="rG" class="violet" min="0" max="1000" value="500">
    </label>
    <label class="ctl">
      <span class="cap">Trail persistence <output id="oTrail"></output></span>
      <input type="range" id="rTrail" class="blue" min="0" max="1000" value="600">
    </label>
    <label class="ctl">
      <span class="cap">Spawn mass <output id="oMass"></output></span>
      <input type="range" id="rMass" class="blue" min="0" max="1000" value="500">
    </label>
    <div class="toggles">
      <label class="switch" id="swCollide">Collisions<input type="checkbox" id="cCollide" checked><span class="knob"></span></label>
      <label class="switch" id="swTrack">Track COM<input type="checkbox" id="cTrack"><span class="knob"></span></label>
      <label class="switch" id="swTrails">Trails<input type="checkbox" id="cTrails" checked><span class="knob"></span></label>
      <label class="switch" id="swVec">Vectors<input type="checkbox" id="cVec"><span class="knob"></span></label>
      <label class="switch" id="swDrag">Drag&nbsp;=&nbsp;pan<input type="checkbox" id="cDrag"><span class="knob"></span></label>
    </div>
  </div>
</section>

<div id="keys" class="ui glass">
  <span><kbd>drag</kbd> launch body</span>
  <span><kbd>wheel</kbd> zoom</span>
  <span><kbd>mid</kbd>/<kbd>right</kbd> pan</span>
  <span><kbd>space</kbd> play</span>
  <span><kbd>S</kbd> step</span>
  <span><kbd>R</kbd> reset</span>
  <span><kbd>X</kbd> clear</span>
  <span><kbd>T</kbd> track COM</span>
  <span><kbd>H</kbd>/<kbd>C</kbd> panels</span>
</div>

<script>
(function () {
  'use strict';

  /* ================================================================ *
   *  0. Small utilities
   * ================================================================ */
  var TAU = Math.PI * 2;
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function logMap(t, lo, hi) { return lo * Math.pow(hi / lo, clamp(t, 0, 1)); }
  function logNorm(v, lo, hi) { return Math.log(v / lo) / Math.log(hi / lo); }

  // Human friendly number: exponential when extreme, otherwise fixed decimals.
  function num(v, digits) {
    if (v === null || v === undefined || !isFinite(v)) return '\u2014';
    var a = Math.abs(v);
    if (a === 0) return '0';
    if (a >= 1e6 || a < 1e-4) return v.toExponential(2);
    var d = digits === undefined ? 3 : digits;
    if (a >= 1000) d = 1; else if (a >= 100) d = 2;
    return v.toFixed(d);
  }
  function ftime(t) {
    if (!isFinite(t)) return '\u2014';
    if (Math.abs(t) >= 1e5) return t.toExponential(2);
    return t.toFixed(2);
  }

  /* ================================================================ *
   *  1. DOM handles
   * ================================================================ */
  function id(x) { return document.getElementById(x); }
  var D = {
    sky: id('sky'), hud: id('hud'), dock: id('dock'),
    hudHead: id('hudHead'), dockHead: id('dockHead'),
    preset: id('preset'), presetCount: id('presetCount'), blurb: id('blurb'),
    btnPlay: id('btnPlay'), btnStep: id('btnStep'), btnReset: id('btnReset'), btnClear: id('btnClear'),
    rDt: id('rDt'), rG: id('rG'), rTrail: id('rTrail'), rMass: id('rMass'),
    oDt: id('oDt'), oG: id('oG'), oTrail: id('oTrail'), oMass: id('oMass'),
    cCollide: id('cCollide'), cTrack: id('cTrack'), cTrails: id('cTrails'),
    cVec: id('cVec'), cDrag: id('cDrag'),
    swCollide: id('swCollide'), swTrack: id('swTrack'), swTrails: id('swTrails'),
    swVec: id('swVec'), swDrag: id('swDrag'),
    sFps: id('sFps'), sBodies: id('sBodies'), sTime: id('sTime'), sSteps: id('sSteps'),
    sT: id('sT'), sU: id('sU'), sE: id('sE'), sDrift: id('sDrift'),
    sP: id('sP'), sPxy: id('sPxy'), sCom: id('sCom'), sZoom: id('sZoom'), sSoft: id('sSoft')
  };

  /* ================================================================ *
   *  2. Simulation state
   * ================================================================ */
  var S = {
    G: 1, Gbase: 1,
    dt: 0.0025, dtBase: 0.0025,
    softening: 0.01,
    collisions: true,
    collideScale: 1,
    sizeK: 0.05,          // radius = sizeK * cbrt(mass)  ->  volume conserved in merges
    running: true,
    time: 0,
    steps: 0,
    bodies: [],
    E0: null, T0: null, U0: null,
    trailSec: 2.5,
    trailsOn: true,
    vectors: false,
    trackCom: false,
    dragPans: false,
    presetId: 'figure8',
    lastU: 0
  };

  var cam = { x: 0, y: 0, tx: 0, ty: 0, scale: 140, tscale: 140 };
  var spawn = { mass: 1, lo: 0.01, hi: 100, base: 1 };
  var nextId = 1;

  function makeBody(x, y, vx, vy, mass, hue) {
    var b = {
      id: nextId++, x: x, y: y, vx: vx, vy: vy, ax: 0, ay: 0,
      mass: mass, hue: hue === undefined ? 195 : hue, trail: [], merged: false
    };
    b.radius = S.sizeK * Math.cbrt(mass);
    return b;
  }
  function refreshRadii() {
    for (var i = 0; i < S.bodies.length; i++) {
      var b = S.bodies[i];
      b.radius = S.sizeK * Math.cbrt(b.mass);
    }
  }

  /* ================================================================ *
   *  3. Canvas / high-DPI plumbing
   * ================================================================ */
  var canvas = D.sky;
  var ctx = canvas.getContext('2d');
  var W = 1, H = 1, dpr = 1;

  function resize() {
    var w = Math.max(1, window.innerWidth);
    var h = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // world <-> screen (screen y points down, world y points up)
  function sxOf(x) { return W * 0.5 + (x - cam.x) * cam.scale; }
  function syOf(y) { return H * 0.5 - (y - cam.y) * cam.scale; }
  function sxToWorld(px) { return cam.x + (px - W * 0.5) / cam.scale; }
  function syToWorld(py) { return cam.y - (py - H * 0.5) / cam.scale; }
  function pointerPos(ev) {
    var r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  /* ================================================================ *
   *  4. Physics: Plummer-softened gravity + Velocity Verlet
   *  Consistent pair of softened potential/force, so the Hamiltonian
   *  H = T + U that we display is the quantity Verlet nearly conserves.
   *      a_i = G * sum_j m_j (r_j - r_i) / (|r|^2 + eps^2)^(3/2)
   *      U   = -G * sum_{i<j} m_i m_j / sqrt(|r|^2 + eps^2)
   * ================================================================ */
  function computeAccelerations() {
    var B = S.bodies, n = B.length, G = S.G;
    var eps = S.softening, e2 = eps * eps;
    var i, j, bi, bj;
    for (i = 0; i < n; i++) { bi = B[i]; bi.ax = 0; bi.ay = 0; }
    var U = 0;
    for (i = 0; i < n; i++) {
      bi = B[i];
      for (j = i + 1; j < n; j++) {
        bj = B[j];
        var dx = bj.x - bi.x;
        var dy = bj.y - bi.y;
        var r2 = dx * dx + dy * dy + e2;
        if (r2 < 1e-14) r2 = 1e-14;
        var r = Math.sqrt(r2);
        var inv3 = G / (r2 * r);           // G / r^3 with softened r
        var fx = inv3 * dx, fy = inv3 * dy;
        bi.ax += fx * bj.mass; bi.ay += fy * bj.mass;
        bj.ax -= fx * bi.mass; bj.ay -= fy * bi.mass;
        U -= G * bi.mass * bj.mass / r;
      }
    }
    S.lastU = U;
    S.dirtyU = false;
    return U;
  }

  function kineticEnergy() {
    var B = S.bodies, T = 0;
    for (var i = 0; i < B.length; i++) {
      var b = B[i];
      T += 0.5 * b.mass * (b.vx * b.vx + b.vy * b.vy);
    }
    return T;
  }

  // Potential recomputed straight from current positions (used when the
  // configuration changed outside the integrator, e.g. after a merge).
  function potentialEnergy() {
    var B = S.bodies, n = B.length, G = S.G, e2 = S.softening * S.softening, U = 0;
    for (var i = 0; i < n; i++) {
      for (var j = i + 1; j < n; j++) {
        var dx = B[j].x - B[i].x, dy = B[j].y - B[i].y;
        var r2 = dx * dx + dy * dy + e2;
        if (r2 < 1e-14) r2 = 1e-14;
        U -= G * B[i].mass * B[j].mass / Math.sqrt(r2);
      }
    }
    return U;
  }

  function energies() {
    var T = kineticEnergy();
    var U = S.dirtyU ? potentialEnergy() : S.lastU;
    return { T: T, U: U, E: T + U };
  }

  // One Velocity Verlet (symplectic) step: half kick - full drift - half kick.
  function step(dt) {
    var B = S.bodies, i, b, h = dt * 0.5;
    computeAccelerations();                 // a(t), U(t)
    for (i = 0; i < B.length; i++) {
      b = B[i];
      b.vx += b.ax * h; b.vy += b.ay * h;
      b.x += b.vx * dt; b.y += b.vy * dt;
    }

    if (!S.trackCom) {
      zoomAnchor = {
        sx: p.x, sy: p.y,
        wx: sxToWorld(p.x), wy: syToWorld(p.y)
      };
    }
    var dy = ev.deltaY;
    if (ev.deltaMode === 1) dy *= 16;          // line units
    else if (ev.deltaMode === 2) dy *= 400;    // page units
    var f = Math.exp(-clamp(dy, -600, 600) * 0.0016);
    cam.tscale = clamp(cam.tscale * f, 1e-6, 1e9);
  }

  function addBody(x, y, vx, vy, mass) {
    if (!(mass > 0)) return null;
    var b = makeBody(x, y, vx, vy, mass, pickHue());
    S.bodies.push(b);
    reBaseline();                              // adding mass is not numerical drift
    return b;
  }
  function pickHue() {
    // cycle pleasantly through the palette for user-spawned bodies
    spawn.hue = (spawn.hue === undefined ? 205 : spawn.hue + 47.3) % 360;
    return spawn.hue;
  }
  function clearBodies() {
    S.bodies = [];
    S.time = 0; S.steps = 0; accSteps = 0;
    S.E0 = null;
    computeAccelerations();
  }

  /* ---- UI wiring helpers ---- */
  function syncSwitches() {
    var pairs = [[D.swCollide, D.cCollide], [D.swTrack, D.cTrack], [D.swTrails, D.cTrails],
    [D.swVec, D.cVec], [D.swDrag, D.cDrag]];
    for (var i = 0; i < pairs.length; i++) {
      if (pairs[i][0]) pairs[i][0].classList.toggle('on', !!pairs[i][1].checked);
    }
  }
  function setSwitch(input, on) {
    input.checked = !!on;
    syncSwitches();
  }
  function setRunning(on) {
    S.running = !!on;
    D.btnPlay.textContent = S.running ? 'Pause' : 'Play';
    D.btnPlay.setAttribute('aria-pressed', S.running ? 'true' : 'false');
    if (!S.running) accSteps = 0;
  }
  /* ================================================================ *
   *  8. Rendering
   * ================================================================ */
  var spriteCache = {};
  function glowSprite(hue) {
    var key = Math.round(hue / 12) * 12;
    if (key < 0) key += 360;
    var cached = spriteCache[key];
    if (cached) return cached;
    var size = 96, mid = size / 2;
    var cv = document.createElement('canvas');
    cv.width = size; cv.height = size;
    var c2 = cv.getContext('2d');
    var grd = c2.createRadialGradient(mid, mid, 0, mid, mid, mid);
    grd.addColorStop(0, 'hsla(' + key + ',100%,94%,0.92)');
    grd.addColorStop(0.16, 'hsla(' + key + ',100%,74%,0.52)');
    grd.addColorStop(0.42, 'hsla(' + key + ',96%,58%,0.16)');
    grd.addColorStop(1, 'hsla(' + key + ',96%,50%,0)');
    c2.fillStyle = grd;
    c2.fillRect(0, 0, size, size);
    spriteCache[key] = cv;
    return cv;
  }

  function minPixel(b) {
    var ref = S.spawnMassRef > 0 ? S.spawnMassRef : 1;
    var m = Math.cbrt(Math.max(b.mass, 1e-30) / ref) * 3.0;
    return clamp(m, 1.15, 5);
  }
  function discPx(b) {
    var r = b.radius * cam.scale;
    return clamp(Math.max(r, minPixel(b)), 0.6, 4000);
  }

  // Adaptive depth grid: keeps a sense of scale while zooming / panning.
  function drawBackground() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    var bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#0a1120');
    bg.addColorStop(0.55, '#070b14');
    bg.addColorStop(1, '#04060c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    var target = 110 / cam.scale;                 // aim for ~110 px grid cells
    var base = Math.pow(10, Math.floor(Math.log10(target)));
    var mult = target / base;
    var step = base * (mult > 5 ? 10 : mult > 2 ? 5 : mult > 1 ? 2 : 1);
    if (!isFinite(step) || step <= 0) return;
    var x0 = cam.x - (W * 0.5) / cam.scale, x1 = cam.x + (W * 0.5) / cam.scale;
    var y0 = cam.y - (H * 0.5) / cam.scale, y1 = cam.y + (H * 0.5) / cam.scale;
    var i, s, nx = Math.ceil((x1 - x0) / step), ny = Math.ceil((y1 - y0) / step);
    if (nx > 300 || ny > 300) return;
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(148,180,220,0.055)';
    ctx.beginPath();
    for (i = Math.floor(x0 / step); i <= Math.floor(x0 / step) + nx; i++) {
      s = Math.round(sxOf(i * step)) + 0.5;
      ctx.moveTo(s, 0); ctx.lineTo(s, H);
    }
    for (i = Math.floor(y0 / step); i <= Math.floor(y0 / step) + ny; i++) {
      s = Math.round(syOf(i * step)) + 0.5;
      ctx.moveTo(0, s); ctx.lineTo(W, s);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(148,180,220,0.14)';
    ctx.beginPath();
    var ax = Math.round(sxOf(0)) + 0.5, ay = Math.round(syOf(0)) + 0.5;
    if (ax > -1 && ax < W + 1) { ctx.moveTo(ax, 0); ctx.lineTo(ax, H); }
    if (ay > -1 && ay < H + 1) { ctx.moveTo(0, ay); ctx.lineTo(W, ay); }
    ctx.stroke();
  }

  function trailLimit() { return Math.round(clamp(S.trailSec * 62, 10, 1100)); }

  function sampleTrails() {
    var lim = trailLimit(), B = S.bodies, i, b, t;
    for (i = 0; i < B.length; i++) {
      b = B[i]; t = b.trail;
      if (t.length) {
        var last = t[t.length - 1];
        if (last[0] === b.x && last[1] === b.y) continue;
      }
      t.push([b.x, b.y]);
      while (t.length > lim) t.shift();
    }
  }
  // Decaying-opacity orbital histories drawn additively in a few alpha bands,
  // so hundreds of trail segments stay cheap.
  function drawTrails() {
    if (!S.trailsOn) return;
    var B = S.bodies, i, j, band, b, t, n, p, a, bands = 5;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (i = 0; i < B.length; i++) {
      b = B[i]; t = b.trail; n = t.length;
      if (n < 4) continue;
      var wpx = clamp(discPx(b) * 0.42, 0.45, 5);
      for (band = 0; band < bands; band++) {
        var i0 = Math.floor(n * band / bands);
        var i1 = Math.floor(n * (band + 1) / bands);
        if (i1 - i0 < 1) continue;
        a = Math.pow((band + 1) / bands, 2.4) * 0.62;
        if (a < 0.012) continue;
        ctx.strokeStyle = 'hsla(' + b.hue + ',92%,68%,' + a.toFixed(3) + ')';
        ctx.lineWidth = wpx * (0.35 + 0.65 * (band + 1) / bands);
        ctx.beginPath();
        p = t[i0];
        ctx.moveTo(sxOf(p[0]), syOf(p[1]));
        for (j = i0 + 1; j <= i1 && j < n; j++) {
          p = t[j];
          ctx.lineTo(sxOf(p[0]), syOf(p[1]));
        }
        ctx.stroke();
      }
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBodies() {
    var B = S.bodies, i, b, x, y, r;
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < B.length; i++) {
      b = B[i];
      r = discPx(b); x = sxOf(b.x); y = syOf(b.y);
      if (x < -260 || x > W + 260 || y < -260 || y > H + 260) continue;
      var halo = Math.max(r * 3.1, r + 9);
      var inten = clamp(0.30 + 0.05 * Math.log10(Math.max(b.mass, 1e-9) / (S.spawnMassRef || 1)) + r * 0.006, 0.16, 0.8);
      ctx.globalAlpha = inten;
      ctx.drawImage(glowSprite(b.hue), x - halo, y - halo, halo * 2, halo * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    for (i = 0; i < B.length; i++) {
      b = B[i];
      r = discPx(b); x = sxOf(b.x); y = syOf(b.y);
      if (x < -120 || x > W + 120 || y < -120 || y > H + 120) continue;
      var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.05, x, y, Math.max(r, 0.8));
      g.addColorStop(0, 'hsl(' + b.hue + ',100%,' + (r > 3 ? 97 : 88) + '%)');
      g.addColorStop(0.55, 'hsl(' + b.hue + ',94%,' + (r > 3 ? 66 : 60) + '%)');
      g.addColorStop(1, 'hsl(' + b.hue + ',86%,' + (r > 3 ? 32 : 26) + '%)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(r, 0.6), 0, TAU);
      ctx.fill();
      if (r > 2.4) {
        ctx.strokeStyle = 'hsla(' + b.hue + ',100%,88%,0.32)';
        ctx.lineWidth = Math.max(0.6, r * 0.05);
        ctx.stroke();
      }
    }
  }

  function arrow(x0, y0, x1, y1, head) {
    var dx = x1 - x0, dy = y1 - y0;
    var len = Math.sqrt(dx * dx + dy * dy);
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
    ctx.stroke();
    if (len < head * 1.2) return;
    var ux = dx / len, uy = dy / len;
    var bx = x1 - ux * head, by = y1 - uy * head;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(bx, by);
    ctx.moveTo(bx - uy * head * 0.42, by + ux * head * 0.42);
    ctx.lineTo(x1, y1);
    ctx.lineTo(bx + uy * head * 0.42, by - ux * head * 0.42);
    ctx.closePath();
    ctx.fill();
  }

  // Velocity vectors of every body (optional overlay)
  function drawVectors() {
    if (!S.vectors) return;
    var B = S.bodies, i, b;
    var vc = characteristicSpeed();
    var scalePx = 0.22 * Math.min(W, H) / Math.max(vc, 1e-12);
    ctx.strokeStyle = 'rgba(124,192,255,0.75)';
    ctx.fillStyle = 'rgba(124,192,255,0.85)';
    ctx.lineWidth = 1.1;
    for (i = 0; i < B.length; i++) {
      b = B[i];
      var x = sxOf(b.x), y = syOf(b.y);
      if (x < -50 || x > W + 50 || y < -50 || y > H + 50) continue;
      var sp = Math.hypot(b.vx, b.vy);
      if (sp < 1e-12) continue;
      var L = clamp(sp * scalePx, 6, 160);
      var ux = b.vx / sp, uy = -b.vy / sp;      // screen y is inverted
      arrow(x + ux * discPx(b), y + uy * discPx(b), x + ux * (discPx(b) + L), y + uy * (discPx(b) + L), 6);
    }
  }
  // Live preview of the body being dragged out: ghost disc + velocity arrow.
  function drawSpawnPreview() {
    if (ptr.mode !== 'spawn') return;
    var x0 = sxOf(ptr.wx), y0 = syOf(ptr.wy);
    var x1 = ptr.curX, y1 = ptr.curY;
    var wx1 = sxToWorld(x1), wy1 = syToWorld(y1);
    var k = spawnDragVelK();
    var vx = (wx1 - ptr.wx) * k, vy = (wy1 - ptr.wy) * k;
    var speed = Math.hypot(vx, vy);
    var r = Math.max(S.sizeK * Math.cbrt(Math.max(spawn.mass, 1e-30)) * cam.scale,
      minPixel({ mass: spawn.mass }));
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = 'rgba(94,234,212,0.75)';
    ctx.beginPath();
    ctx.arc(x0, y0, r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(x0 - 9, y0); ctx.lineTo(x0 + 9, y0);
    ctx.moveTo(x0, y0 - 9); ctx.lineTo(x0, y0 + 9);
    ctx.strokeStyle = 'rgba(94,234,212,0.45)';
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.6;
    arrow(x0, y0, x1, y1, 9);
    ctx.font = '600 11px ' + 'ui-monospace, "SFMono-Regular", Consolas, monospace';
    ctx.textBaseline = 'bottom';
    var label = 'm ' + num(spawn.mass, 4) + '   |v| ' + (speed < 1e-9 ? '0 (drop at rest)' : num(speed, 4));
    var tx = clamp(x1 + 12, 6, W - 190), ty = clamp(y1 - 8, 18, H - 8);
    var wTxt = ctx.measureText(label).width + 12;
    ctx.fillStyle = 'rgba(6,10,18,0.72)';
    ctx.strokeStyle = 'rgba(148,163,184,0.35)';
    ctx.lineWidth = 1;
    roundRect(tx - 6, ty - 15, wTxt, 19, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(232,238,251,0.95)';
    ctx.fillText(label, tx, ty);
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y); ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr); ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr); ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function drawComMarker() {
    if (!S.trackCom || !S.bodies.length) return;
    var c = centerOfMass();
    var x = sxOf(c.x), y = syOf(c.y);
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(x, y, 7, 0, TAU);
    ctx.moveTo(x - 13, y); ctx.lineTo(x + 13, y);
    ctx.moveTo(x, y - 13); ctx.lineTo(x, y + 13);
    ctx.stroke();
    ctx.font = '600 10px ui-monospace, "SFMono-Regular", Consolas, monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.textBaseline = 'bottom';
    ctx.fillText('COM', x + 11, y - 8);
  }

  function drawPausedBadge() {
    if (S.running) return;
    ctx.font = '600 10.5px ' + 'ui-sans-serif, system-ui, sans-serif';
    var txt = 'paused \u00b7 ' + (S.bodies.length) + ' bodies';
    var w = ctx.measureText(txt).width + 18;
    var x = W - w - 14, y = 22;
    ctx.fillStyle = 'rgba(8,12,20,0.62)';
    ctx.strokeStyle = 'rgba(148,163,184,0.32)';
    ctx.lineWidth = 1;
    roundRect(x, y, w, 22, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,200,97,0.95)';
    ctx.textBaseline = 'middle';
    ctx.fillText(txt, x + 9, y + 12);
  }

  function render() {
    drawBackground();
    drawTrails();
    drawBodies();
    drawVectors();
    drawComMarker();
    drawSpawnPreview();
    drawPausedBadge();
  }
  /* ================================================================ *
   *  9. HUD
   * ================================================================ */
  var fpsSmooth = 60, lastHud = 0, stepsAtLast = 0, stepsPerSec = 0;

  function updateHud(force) {
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (!force && now - lastHud < 170) return;
    var span = Math.max((now - lastHud) / 1000, 1e-6);
    lastHud = now;
    stepsPerSec = (S.steps - stepsAtLast) / span;
    stepsAtLast = S.steps;

    D.sFps.textContent = Math.round(fpsSmooth);
    D.sBodies.textContent = String(S.bodies.length);
    D.sTime.textContent = ftime(S.time);
    D.sSteps.textContent = Math.round(stepsPerSec);

    var e = energies();
    D.sT.textContent = num(e.T, 4);
    D.sU.textContent = num(e.U, 4);
    D.sE.textContent = num(e.E, 5);

    var driftPct = null, driftAbs = null;
    if (S.E0 !== null && isFinite(S.E0) && isFinite(e.E)) {
      driftAbs = e.E - S.E0;
      if (Math.abs(S.E0) > 1e-9) driftPct = 100 * driftAbs / Math.abs(S.E0);
    }
    var dTxt, cls = 'good';
    if (driftPct !== null) {
      var ad = Math.abs(driftPct);
      cls = ad < 0.05 ? 'good' : (ad < 1 ? 'warn' : 'bad');
      dTxt = (driftPct >= 0 ? '+' : '') + (ad < 0.001 ? driftPct.toExponential(1) : driftPct.toFixed(4)) + '%';
    } else if (driftAbs !== null) {
      dTxt = (driftAbs >= 0 ? '+' : '') + num(driftAbs, 4) + ' abs';
      cls = Math.abs(driftAbs) < 1e-6 ? 'good' : 'warn';
    } else {
      dTxt = '\u2014';
    }
    D.sDrift.textContent = dTxt;
    D.sDrift.className = cls;

    var p = momentum();
    D.sP.textContent = num(p.mag, 4);
    D.sPxy.textContent = num(p.x, 3) + ', ' + num(p.y, 3);
    var c = centerOfMass();
    D.sCom.textContent = num(c.x, 3) + ', ' + num(c.y, 3);
    D.sZoom.textContent = num(cam.scale, 2) + ' px/u';
  }

  /* ================================================================ *
   *  10. Main loop
   * ================================================================ */
  var lastTs = 0;

  function stepOnce() {
    step(S.dt);
    sampleTrails();
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var dtReal = lastTs ? (ts - lastTs) / 1000 : 1 / 60;
    if (!(dtReal > 0)) dtReal = 1 / 60;
    dtReal = Math.min(dtReal, 0.25);
    lastTs = ts;
    fpsSmooth += (1 / dtReal - fpsSmooth) * 0.12;

    if (S.running) {
      var cap = 220;
      if (S.bodies.length > 120) cap = 110;
      if (S.bodies.length > 320) cap = 55;
      accSteps += dtReal * (S.speed || 30) * 60;
      var n = Math.floor(accSteps);
      if (n > 0) {
        if (n > cap) n = cap;
        accSteps -= n;
        if (accSteps > cap) accSteps = cap;
        for (var i = 0; i < n; i++) step(S.dt);
        sampleTrails();
      }
    } else {
      accSteps = 0;
    }

    updateCamera(dtReal);
    render();
    updateHud(false);
  }
  /* ================================================================ *
   *  11. Event wiring
   * ================================================================ */
  canvas.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', function () {
    ptr.mode = null; ptr.id = null; canvas.classList.remove('grabbing');
  });
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', resize, { passive: true });
  document.addEventListener('visibilitychange', function () { accSteps = 0; lastTs = 0; });

  D.preset.addEventListener('change', function () { loadPreset(D.preset.value, true); });
  D.btnPlay.addEventListener('click', function () { setRunning(!S.running); });
  D.btnStep.addEventListener('click', function () { setRunning(false); stepOnce(); });
  D.btnReset.addEventListener('click', function () { loadPreset(S.presetId, true); });
  D.btnClear.addEventListener('click', clearBodies);

  D.cCollide.addEventListener('change', function () { S.collisions = D.cCollide.checked; syncSwitches(); });
  D.cTrack.addEventListener('change', function () { S.trackCom = D.cTrack.checked; syncSwitches(); });
  D.cTrails.addEventListener('change', function () { S.trailsOn = D.cTrails.checked; syncSwitches(); });
  D.cVec.addEventListener('change', function () { S.vectors = D.cVec.checked; syncSwitches(); });
  D.cDrag.addEventListener('change', function () { S.dragPans = D.cDrag.checked; syncSwitches(); });

  D.hudHead.addEventListener('click', function () { D.hud.classList.toggle('collapsed'); });
  D.dockHead.addEventListener('click', function () { D.dock.classList.toggle('collapsed'); });

  window.addEventListener('keydown', function (e) {
    var t = e && e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    var k = String(e.key || '').toLowerCase();
    if (k === ' ' || e.code === 'Space') { e.preventDefault(); setRunning(!S.running); }
    else if (k === 's') { e.preventDefault(); setRunning(false); stepOnce(); }
    else if (k === 'r') { loadPreset(S.presetId, true); }
    else if (k === 'x') { clearBodies(); }
    else if (k === 't') { setSwitch(D.cTrack, !D.cTrack.checked); S.trackCom = D.cTrack.checked; }
    else if (k === 'h') { D.hud.classList.toggle('collapsed'); }
    else if (k === 'c') { D.dock.classList.toggle('collapsed'); }
    else if (k === 'f') { fitView(); }
  });

  /* ================================================================ *
   *  12. Boot
   * ================================================================ */
  (function init() {
    var i, o;
    for (i = 0; i < PRESETS.length; i++) {
      o = document.createElement('option');
      o.value = PRESETS[i].id;
      o.textContent = (i + 1) + '.  ' + PRESETS[i].label;
      D.preset.appendChild(o);
    }
    D.presetCount.textContent = PRESETS.length + ' loaded';
    resize();
    loadPreset('figure8', true);
    setRunning(true);
    syncSwitches();
    requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
